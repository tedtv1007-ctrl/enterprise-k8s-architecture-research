name: Enterprise K8S Architecture CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # Install kubeval or helm for linting
    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Lint Cilium Values (Dry-run)
      run: |
        helm repo add cilium https://helm.cilium.io/
        helm repo update
        # Using helm install dry-run with debug to see the actual error message in logs
        helm install cilium cilium/cilium --version 1.14.0 --values manifests/cilium-values-production.yaml --namespace kube-system --dry-run --debug
