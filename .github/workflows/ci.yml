name: Enterprise K8S Architecture CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # Install kubeval or helm for linting
    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Lint Cilium Values (Dry-run)
      run: |
        # Add repo and update to ensure chart is found
        helm repo add cilium https://helm.cilium.io/
        helm repo update
        # Using chart name without slash if repo is added
        helm template cilium cilium/cilium --values manifests/cilium-values-production.yaml > /dev/null
