# ExternalSecrets operator - SecretStore example for AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secret-store
spec:
  provider:
    aws:
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecret:
            name: aws-creds
            key: accessKey
          secretAccessKeySecret:
            name: aws-creds
            key: secretKey

# Example ExternalSecret to sync DB credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: prod/db/username
    - secretKey: password
      remoteRef:
        key: prod/db/password
